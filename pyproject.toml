[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcw16basic"
version = "1.0.0rc1"
description = "PcW16 BASIC: a BASIC cross-compiler for the Amstrad PcW16 (Rosanne)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
pcw16basic = "pbas.cli:main"

[tool.setuptools]
packages = ["pbas"]
